<html>
<head>
<title>if-else-if statment</title>
</head>
<body style="background-color:pink";>
<center><h1 style="color:green;">if-else-if statment</h1>
<script>
var age=50;
if (age<13)
{
document.write("<font color='pink'>Child</font>");
}
else if(age<20)
{
document.write("<font color='red'>Teenage</font>");
}
else
{
document.write("<font color='blue'>Adult</font>");
}
</script>
</body>
</html>
