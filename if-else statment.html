<body style="background-color:pink;">
<h1 style="text-align:center">if-else statment</h1>
<script>
var age=17;
if (age>=18)
{
document.write("<font color='green'>your are eligible for vote</font>");
}
else
{
document.write("<font color='red'>your are not eligible for vote</font>");
}
</script>
</body>
